<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">📄</div>
        <div class="stat-value">{{pages_total}}</div>
        <div class="stat-label">Всего страниц</div>
    </div>
    <div class="stat-card stat-success">
        <div class="stat-icon">✅</div>
        <div class="stat-value">{{pages_published}}</div>
        <div class="stat-label">Опубликовано</div>
    </div>
    <div class="stat-card stat-accent">
        <div class="stat-icon">📝</div>
        <div class="stat-value">{{pages_draft}}</div>
        <div class="stat-label">Черновики</div>
    </div>
    <div class="stat-card stat-danger">
        <div class="stat-icon">👥</div>
        <div class="stat-value">{{users_total}}</div>
        <div class="stat-label">Пользователей</div>
    </div>
</div>
