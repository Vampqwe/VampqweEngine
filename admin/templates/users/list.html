<div class="toolbar">
    <div class="toolbar-search">
        <span class="toolbar-search-icon">🔍</span>
        <input type="text" class="form-control" placeholder="Поиск по имени или email...">
    </div>
    <button class="btn btn-primary" data-modal="modal-add-user">+ Новый пользователь</button>
</div>

<div class="card">
    <div class="card-body" style="padding: 0;">
        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <tr>
                        <th>Пользователь</th>
                        <th>Email</th>
                        <th>Роль</th>
                        <th>Статус</th>
                        <th>Последний вход</th>
                        <th style="width: 120px; text-align: right;">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    {users_rows}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальное окно добавления пользователя -->
<div class="modal-overlay" id="modal-add-user">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Новый пользователь</h3>
            <button class="modal-close">×</button>
        </div>
        <form method="POST" action="/admin/users/create">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Имя <span class="required">*</span></label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email <span class="required">*</span></label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль <span class="required">*</span></label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Роль</label>
                    <select name="role" class="form-control">
                        <option value="viewer">Viewer</option>
                        <option value="editor">Editor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
                <button type="submit" class="btn btn-primary">Создать</button>
            </div>
        </form>
    </div>
</div>
