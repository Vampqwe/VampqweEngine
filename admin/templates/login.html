<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админ-панель</title>
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-icon">🐾</div>
                <div class="login-logo-title">VampqweEngine</div>
                <div class="login-logo-subtitle">Панель управления</div>
            </div>

            {alerts}

            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="admin@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-check">
                        <input type="checkbox" name="remember">
                        <span>Запомнить меня</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
