<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><?= htmlspecialchars($errorTitle ?? 'Ошибка сервера') ?></title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            color: #2c3e50;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 720px;
            width: 100%;
            padding: 40px;
            border-left: 5px solid #c0392b;
        }
        .error-code {
            font-size: 64px;
            font-weight: 700;
            color: #c0392b;
            margin: 0 0 10px;
            line-height: 1;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 20px;
            color: #2c3e50;
        }
        .error-message {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin: 0 0 25px;
        }
        .error-details {
            background: #f8f9fa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 20px;
            margin-top: 20px;
        }
        .error-details h3 {
            margin: 0 0 12px;
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .error-file {
            font-family: "SF Mono", Monaco, Consolas, monospace;
            font-size: 13px;
            color: #c0392b;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .error-trace {
            font-family: "SF Mono", Monaco, Consolas, monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #495057;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .error-actions {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background: #2980b9; }
        .btn-secondary {
            background: #95a5a6;
        }
        .btn-secondary:hover { background: #7f8c8d; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <h1 class="error-title"><?= htmlspecialchars($errorTitle ?? 'Внутренняя ошибка сервера') ?></h1>
        <p class="error-message">
            <?= htmlspecialchars($errorMessage ?? 'Извините, на сервере произошла ошибка. Пожалуйста, попробуйте позже.') ?>
        </p>

        <?php if (!empty($errorFile) || !empty($errorTrace)): ?>
            <div class="error-details">
                <?php if (!empty($errorFile)): ?>
                    <h3>Источник ошибки</h3>
                    <div class="error-file"><?= htmlspecialchars($errorFile) ?></div>
                <?php endif; ?>

                <?php if (!empty($errorTrace)): ?>
                    <h3>Трассировка стека</h3>
                    <pre class="error-trace"><?= htmlspecialchars($errorTrace) ?></pre>
                <?php endif; ?>
            </div>
        <?php endif; ?>

        <div class="error-actions">
            <a href="/" class="btn">На главную</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Назад</a>
        </div>
    </div>
</body>
</html>
