<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTitle}}</title>
</head>
<body>
    <main style="max-width:420px; margin:60px auto; font-family: Arial, sans-serif;">
        <h1>{{pageTitle}}</h1>

        <p style="color: #b00020;">{{error}}</p>

        <form method="post" action="/register">
            <p>
                <label for="email">Email</label><br>
                <input id="email" type="email" name="email" required style="width:100%; padding:10px; box-sizing:border-box;">
            </p>
            <p>
                <label for="password">Пароль</label><br>
                <input id="password" type="password" name="password" required minlength="8" style="width:100%; padding:10px; box-sizing:border-box;">
            </p>
            <p>
                <button type="submit" style="width:100%; padding:10px;">Зарегистрироваться</button>
            </p>
        </form>

        <p>
            <a href="/login">Уже есть аккаунт?</a>
        </p>
    </main>
</body>
</html>
