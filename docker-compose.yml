services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vampqwe-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_LOGIN: vampqwe
      DB_PASSWORD: secret
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: vampqwe
      DB_CHARSET: utf8mb4
      DB_DRIVER: mysql
      SAVE_SESSION_HANDLER: redis
      SAVE_SESSION_PATH_METHOD: tcp
      SAVE_SESSION_PATH_HOST: redis
      SAVE_SESSION_PATH_PORT: "6379"
      SAVE_SESSION_PATH_AUTH: ""
      APP_DEBUG: "true"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: vampqwe-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vampqwe
      MYSQL_USER: vampqwe
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: vampqwe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
